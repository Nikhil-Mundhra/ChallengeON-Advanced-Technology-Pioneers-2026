# Presentation content: the only file to edit. Build: `twin report deck` → output/deck/deck.pptx (+ deck.pdf)
# Keys per slide type are listed in meta/deck/README.md. Every slide has `type`, `kicker`, `title`,
# `subtitle` (the cover: `title`, `subtitle`) and `notes`; `footnote` is optional.
# Numbers: write {name}; they are filled from artifacts and from the `scenarios:` below (run through
# the planning simulator). Hero and stat values must be placeholders. Inline accents: **bold**,
# ==accent==; one or two per slide, on the key number or claim.

footer: "Abu Dhabi Tourism Digital Twin  /  ChallengeON ATP 2026"

# Fallbacks, used only when the artifact is missing; each names its source.
numbers:
  val.twin_daily.domestic: {value: "4.2", source: "validation re-run on 901edb1 (#11)"}
  val.twin_daily.international: {value: "4.6", source: "validation re-run on 901edb1 (#11)"}

# Named what-if scenarios: market, season and any ScenarioLever field
# (delta_frequency, aircraft_gauge, delta_seats_pct, delta_load_factor, delta_p2p_share, ...).
scenarios:
  uk_flights: {market: UNITED KINGDOM, season: Winter_Peak, delta_frequency: 2, aircraft_gauge: 290}
  uk_fuller: {market: UNITED KINGDOM, season: Winter_Peak, delta_load_factor: 0.02}
  sweden_route: {market: SWEDEN, season: Winter_Peak, delta_frequency: 2, aircraft_gauge: 180}
  india_seats: {market: INDIA, season: Winter_Peak, delta_seats_pct: 0.10}

slides:
  - type: cover
    kicker: "Abu Dhabi Tourism Digital Twin"
    title: "What if more flights meant more hotel stays?"
    subtitle: "A planning tool for DCT Abu Dhabi. It turns a flight change into hotel visitors and hotel nights."
    line: "ChallengeON ATP 2026"
    notes: >-
      We built a simulator that answers one question for DCT Abu Dhabi: if flights change, how many
      more people stay in hotels, and for how many nights. It runs in a web browser and uses the
      flight and hotel data supplied for the challenge.

  - type: columns
    kicker: "The question"
    title: "More seats do not fill hotels one for one"
    subtitle: "People drop out at each step between a plane seat and a hotel room."
    columns:
      - head: "What changes"
        body: "A new route, more flights, bigger aircraft, fuller flights or a season mix."
      - head: "What is lost"
        body: "Some fly on, some stay with family, and stays vary in length."
      - head: "What we answer"
        body: "How many ==more hotel visitors and nights== each change brings a week."
    notes: >-
      These are the five planning questions: a new route, more weekly flights, bigger aircraft,
      fuller flights, and a different market mix by season. Passengers who connect onward never
      check in, residents go home, and some visitors stay with friends. The simulator models each
      of these steps per market and season.

  - type: flow
    kicker: "How it works"
    title: "From seats to hotel nights in five steps"
    subtitle: "Each step keeps a share of the people from the step before."
    flow:
      - steps:
          - {head: "Seats", detail: "flights × seats each"}
          - {head: "Passengers", detail: "seats filled"}
          - {head: "Stay in Abu\u00a0Dhabi", detail: "no onward flight"}
          - {head: "Hotel visitors", detail: "check-ins"}
          - {head: "Hotel nights", detail: "guests each night"}
      - label: "What runs it"
        steps:
          - {head: "Flight and hotel\u00a0data", detail: "pandas, DuckDB"}
          - {head: "Models", detail: "scikit-learn"}
          - {head: "Simulator", detail: "what-if levers"}
          - {head: "Web app", detail: "React"}
    notes: >-
      Every link in the chain is fitted per market and season from past flights and hotel
      check-ins, and a calendar model adds holidays and events. The models are fitted offline in
      Python. The web app repeats the same arithmetic in the browser, so it needs no server.

  - type: hero
    kicker: "Example: more flights"
    title: "Two more UK flights a week in winter"
    subtitle: "Each added flight has 290 seats. Everything else stays the same."
    hero:
      value: "{scen.uk_flights.visitors_delta}"
      label: "hotel visitors a week"
    side:
      - "From {scen.uk_flights.visitors_base} to {scen.uk_flights.visitors_sim} a week"
      - "About =={scen.uk_flights.nights_delta} hotel nights=="
    footnote: "Weekly hotel nights in this scenario: {scen.uk_flights.p10} to {scen.uk_flights.p90} (stated range)."
    notes: >-
      Hotel visitors are check-ins: one person arriving at a hotel. Hotel nights count every guest
      on every night, so a three-night stay counts three times. The range is wide because weekly
      hotel demand moves a lot even without a flight change.

  - type: stats
    kicker: "Other levers"
    title: "Three more changes a planner can test"
    subtitle: "All in winter. Each number is extra hotel visitors a week."
    stats:
      - label: "UK flights 2 points fuller"
        value: "{scen.uk_fuller.visitors_delta}"
        caption: "{scen.uk_fuller.nights_delta} hotel nights"
      - label: "A new route from Sweden"
        value: "{scen.sweden_route.visitors_delta}"
        caption: "{scen.sweden_route.nights_delta} hotel nights"
      - label: "10% more seats on India flights"
        value: "{scen.india_seats.visitors_delta}"
        caption: "{scen.india_seats.nights_delta} hotel nights"
    footnote: "Sweden: 2 flights of 180 seats a week, estimated from similar markets."
    notes: >-
      Fuller flights means the share of seats sold rises by two points, for example from 80% to 82%.
      Sweden has no route history in the data, so the simulator borrows the behaviour of similar
      European markets. Treat that number as a first estimate until real bookings exist.

  - type: chart
    kicker: "What matters most"
    title: "Which lever moves hotel nights most"
    subtitle: "Each lever moved alone, low to high, for the UK in winter."
    figure: tornado
    scenario: uk_flights
    side:
      - "The largest swings come from =={scen.uk_flights.lever1}== and =={scen.uk_flights.lever2}==."
    side_note: "Each lever has its own test range, so compare the order, not the exact gaps."
    notes: >-
      Each bar moves one lever between a low and a high setting while the others stay fixed:
      seats by 15%, load factor by 4 points, stopover share by 5 points, hotel capture by 10% and
      nights per visitor by half a night. The stopover share is the share of passengers who end
      their trip in Abu Dhabi.

  - type: table
    kicker: "Accuracy"
    title: "How close the forecasts come"
    subtitle: "Errors on past weeks and days the models never saw. Lower is better."
    table:
      header: ["Weekly planning model", "Error"]
      widths: [0.72, 0.28]
      highlight_row: 3
      rows:
        - ["Seasonal average", "{plan.prior.wmape}%"]
        - ["Calendar only", "{plan.calendar.wmape}%"]
        - ["Flight chain only", "{plan.structural.wmape}%"]
        - ["Flight chain + calendar and events", "{plan.hybrid.wmape}%"]
    side:
      - "Daily forecast error: {val.twin_daily.domestic}% domestic, {val.twin_daily.international}% international"
      - "Ranges covered **{plan.coverage_pct}% of real weeks**, against 80% intended"
    notes: >-
      Error is the average miss as a share of the true total. The weekly models were trained on
      2023 to 2024 and scored on later weeks; the daily model was scored from seven starting points
      it never saw. The daily model knows each day's hotel check-ins, so it is more accurate than
      the weekly planner, which starts from flights.

  - type: stats
    kicker: "Winter outlook"
    title: "This winter could bring more hotel nights"
    subtitle: "December to February, in millions of hotel nights."
    stats:
      - label: "Last winter, {outlook.previous_window}"
        value: "{outlook.previous.guests}m"
        caption: "model estimate"
      - label: "This winter, {outlook.window}"
        value: "{outlook.trend.guests}m"
        caption: "if recent trends hold"
      - label: "Difference"
        value: "{outlook.trend.change}%"
        caption: "{outlook.flat.change}% if arrivals stay flat"
    footnote: "Same method on winter {outlook.bt.window}: the trend path was {outlook.bt.trend.total}% off, the flat path {outlook.bt.flat.total}%."
    notes: >-
      Hotel data ends in {outlook.guests_known_to}, so this winter's arrivals are an assumption.
      The trend path repeats each market's recent growth; the flat path keeps arrivals at last
      year's level. When we ran the same method on an earlier winter, the trend path was too high,
      so read the trend figure as an upper case and rerun once airlines file winter schedules.

  - type: rows
    kicker: "Assumptions and limits"
    title: "What the numbers assume"
    subtitle: "Read every result with these limits in mind."
    rows:
      - {head: "One visitor per passenger", body: "Existing visitors are not multiplied"}
      - {head: "Departure country", body: "Stands in for nationality"}
      - {head: "Nights per visitor", body: "A ratio, not a measured stay"}
      - {head: "Future years", body: "Repeat past seasons by default"}
      - {head: "Ranges", body: "Cover =={plan.coverage_pct}% of real weeks==, not 80%"}
      - {head: "Data", body: "Licensed for this competition only"}
    notes: >-
      An added passenger can bring at most one extra hotel visitor; visitors who already arrive by
      other routes are left as they are. Flight data records where a flight left from, hotel data
      records nationality, and we link the two per market. Nights per visitor is guests divided by
      check-ins, which is not the same as how long people stay.

  - type: columns
    tone: dark
    kicker: "What to do next"
    title: "What a planner should do with this"
    subtitle: "Three habits for the next route decision."
    columns:
      - head: "Test routes first"
        body: "Run a route on the simulator before airline talks."
      - head: "Look past seat counts"
        body: "In the UK test, =={scen.uk_flights.lever1}== and {scen.uk_flights.lever2} moved hotel nights most."
      - head: "Plan with the range"
        body: "Staff and price for both ends of the range."
    footnote: "Live site: https://abu-dhabi-hotel-outlook.vercel.app"
    notes: >-
      The simulator is live at abu-dhabi-hotel-outlook.vercel.app and needs no login. A route test
      takes a minute: pick the market and season, move the levers, read visitors and nights with
      their range. Rerun the outlook when new hotel data or airline schedules arrive.

# Presentation content — the only file to edit. Build: `twin report deck` → output/deck/deck.pptx (+ deck.pdf)
#
# Each slide: title, message (one line under the title), bullets (check-icon list: text + short
# detail lines), stats (big-number tiles: value, label, tone), cards (title, lines, tone), with
# band_position: top|bottom; layout: cover (title slide: kicker, title, message, cards);
# figure (a name from reporting/deck/figures.py, or asset:<file> in meta/deck/assets/),
# table (header + rows), notes (speaker notes).
# Numbers: write {name}. They are filled from artifacts (output/validation_summary.json,
# output/outlook.json, lake/curated/evaluation_results.json); the `numbers:` block below is the fallback and must name
# its source. Writing rules: plain words; a technical term only with its job ("we used X to do Y");
# a detail always under its parent bullet.

footer: "Abu Dhabi Tourism Digital Twin · DCT Abu Dhabi · Advanced Technology Pioneers 2026"

numbers:
  val.naive_364.domestic: {value: "16.9", source: "validation re-run on 901edb1 (#11)"}
  val.naive_364.international: {value: "23.0", source: "validation re-run on 901edb1 (#11)"}
  val.time_only.domestic: {value: "10.1", source: "validation re-run on 901edb1 (#11)"}
  val.time_only.international: {value: "10.7", source: "validation re-run on 901edb1 (#11)"}
  val.flow_only.domestic: {value: "9.6", source: "validation re-run on 901edb1 (#11)"}
  val.flow_only.international: {value: "5.4", source: "validation re-run on 901edb1 (#11)"}
  val.twin_daily.domestic: {value: "4.2", source: "validation re-run on 901edb1 (#11)"}
  val.twin_daily.international: {value: "4.6", source: "validation re-run on 901edb1 (#11)"}
  const.wizz_drop: {value: "45–49%", source: "test-period arrivals vs a year earlier, 5 Wizz Air markets (model_design §4.7)"}
  const.order_gap: {value: "8.6", source: "model_design §4.1: greedy fit order vs joint backfit"}
  const.pooling_gain_val: {value: "0.55", source: "#16, validation origins"}
  const.recency_gain_val: {value: "0.40", source: "pooled grid, validation origins (#16 follow-up)"}
  const.ramadan_domestic: {value: "−24%", source: "analysis/model_time.md §2: Ramadan event kernel, domestic"}
  const.ramadan_international: {value: "−18%", source: "analysis/model_time.md §2: Ramadan event kernel, international"}
  const.saturday_domestic: {value: "+23%", source: "analysis/model_time.md §2: domestic Saturday vs Monday"}

slides:
  - layout: cover
    kicker: "Abu Dhabi Tourism Digital Twin"
    title: "Know hotel demand before it arrives"
    message: "Daily hotel guests by market, so hotels and DCT can plan staff, prices and campaigns ahead."
    cards:
      - {title: "Predict", lines: ["Daily guests by market and nationality"], tone: dark}
      - {title: "Forecast", lines: ["Next winter under arrival scenarios"]}
      - {title: "Explain", lines: ["What moves guest numbers"], tone: red}
    notes: "One goal, three tasks. The question we answer: how many guests, from which countries, on which days, and what changes that number."

  - title: "Problem and data"
    message: "Flights bring passengers; only part of them become hotel guests."
    figure: conversion_chain
    figure_position: top
    bullets:
      - text: "Data we have"
        children:
          - "Daily guests and arrivals by nationality, 2022 → Jul 2025"
          - "Arrivals only, Aug 2025 → Feb 2026: the period to predict"
      - text: "The catch"
        children:
          - "Flight country = departure; hotel country = nationality. We model each market from its own check-ins"
    notes: "Hidden small counts ('*') are treated as unknown, not zero. Flights per route and airline are daily from 2023."

  - title: "System design"
    message: "Heavy work runs once, offline; the web app only reads the results."
    figure: system_diagram
    notes: "Build: Python pipeline (DuckDB data lake, feature and model registries, validation) exports one versioned JSON bundle. Serve: static React app with the same maths in TypeScript, checked against Python to 1e-9, so it runs free with no server."

  - title: "Inputs we chose, and why"
    message: "Each input has one job; anything that leaks the answer is left out."
    table:
      header: ["Input", "Used", "Why", "Assumption"]
      widths: [0.27, 0.11, 0.35, 0.27]
      rows:
        - ["Hotel arrivals, last 22 days", "Yes", "Tonight's guests checked in recently", "Stay patterns change slowly"]
        - ["Calendar: season, weekday, holidays", "Yes", "Demand follows the calendar too", "Each effect scales guests by a %"]
        - ["Small nationalities, grouped", "Pooled", "Too few days to fit alone", "Group members behave alike"]
        - ["Past guest counts", "No", "Unknown in the period to predict", "—"]
        - ["Transfer share, stay length", "No", "No measurable gain", "—"]
    notes: "Flight seats feed the what-if simulator; the daily model starts from hotel check-ins, which already reflect who flew in."

  - title: "Model: arrivals become guests"
    message: "Guests tonight = guests still staying from recent check-ins × that day's calendar effect."
    figure: model_form
    figure_position: top
    bullets:
      - text: "Distributed lag: counts who is still in the hotel"
        children:
          - "One weight per day since check-in, never negative, never rising"
      - text: "Calendar multiplier: seasons, weekdays, holidays"
        children:
          - "Ramadan, Eid, National Day and New Year each get their own shape"
    notes: "Guests_t = (c_t + Σ_k w_k · Arrivals_(t−k)) × exp(season + weekday + events). c_t is a slowly moving base of long-stay guests. About 1,300 days of data: a neural network did worse than 'same day last year'."

  - title: "Training: fit everything together"
    message: "Arrivals and the calendar overlap, so they are fitted jointly, not one after another."
    figure: validation_bars
    bullets:
      - text: "Joint fit"
        children:
          - "Fitting order alone moved error by {const.order_gap} points"
          - "Joint fitting gives one answer in any order"
      - text: "Extra interactions: tested, dropped"
        children:
          - "None cut error by the 0.3-point bar"
      - text: "Small nationalities pooled"
        children:
          - "{const.pooling_gain_val} points better; recent years weighted: {const.recency_gain_val} more"
    notes: "Backfitting: each part is fitted with the others held fixed, repeated until nothing moves. Interactions tested: weekday × season, stay pattern × season, a boosted-tree model on the leftover error. The chart shows what each part adds."

  - title: "Validation: only on periods the model never saw"
    message: "Trained on the past, scored on the next 6 months, at 7 starting points."
    figure: protocol_timeline
    stats:
      - {value: "{val.twin_daily.domestic}%", label: "Our error, domestic", tone: dark}
      - {value: "{val.twin_daily.international}%", label: "Our error, international", tone: dark}
      - {value: "{val.naive_364.domestic}%", label: "'Same day last year', domestic", tone: sand}
      - {value: "{val.naive_364.international}%", label: "'Same day last year', international", tone: sand}
    notes: "Error is WMAPE on daily totals. A 21-day gap separates training and scoring. Feb–Jul 2025 was kept aside and scored once, after every choice. A change counts only if it is at least 0.3 points better with a bootstrap range that excludes zero."

  - title: "What we found"
    message: "Arrivals drive international guests; the calendar drives domestic guests."
    figure: tornado
    bullets:
      - text: "International follows arrivals"
        children:
          - "Error {val.flow_only.international}% from arrivals alone, {val.time_only.international}% from the calendar alone"
      - text: "Domestic follows the calendar"
        children:
          - "Saturdays {const.saturday_domestic}; Ramadan {const.ramadan_domestic}"
      - text: "One airline can move a market"
        children:
          - "Wizz Air's exit: arrivals from 5 markets down {const.wizz_drop}"
      - text: "In the simulator, {tornado.top1} matters most"
    notes: "Chart: UK, winter peak, two more flights a week on a 290-seat aircraft, each lever moved alone. International Ramadan effect: {const.ramadan_international}."

  - title: "Outlook: winter {outlook.window}"
    message: "Flat if arrivals hold; up if each market's trend continues."
    stats:
      - {value: "{outlook.flat.change}%", label: "Arrivals flat", tone: dark}
      - {value: "{outlook.trend.change}%", label: "Arrival trend continues"}
      - {value: "{outlook.trend.top1}", label: "Top source market, {outlook.trend.top1_share}% of guests", tone: red}
    band_position: top
    figure: outlook_months
    bullets:
      - text: "Who"
        children:
          - "{outlook.trend.top1}, {outlook.trend.top2}, {outlook.trend.top3}; domestic about {outlook.trend.domestic_share}%"
      - text: "When"
        children:
          - "Peak in December; low in February (Ramadan)"
      - text: "How sure"
        children:
          - "A range: on {outlook.bt.window}, flat {outlook.bt.flat.total}%, trend {outlook.bt.trend.total}%"
    notes: "Guest data ends {outlook.guests_known_to}, so future arrivals are a scenario. The model converts arrivals into guests with about 4–5% error; the uncertainty is the arrivals. Changes compare with the model's estimate for winter {outlook.previous_window}. Rerun with real seats once airlines file winter schedules."

  - title: "Use, limits, and how to reproduce"
    message: "Plan by market and week; rerun when new arrivals or schedules land."
    cards:
      - title: "For hotels and DCT"
        tone: dark
        lines: ["Staff and prices: daily guests with a range", "Campaigns: target the leading markets", "Route deals: test before signing"]
      - title: "Limits"
        tone: red
        lines: ["No spending or trip purpose", "Hotel stays only", "Nationality is not residence", "Beyond known arrivals: a scenario"]
      - title: "Reproduce"
        tone: sand
        lines: ["One command rebuilds data, models, validation, outlook and this deck", "Every number read from saved results"]
    notes: "Commands: twin validate, twin outlook, twin report deck."

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "challengeon-tourism-twin"
version = "0.1.0"
description = "Abu Dhabi Tourism Digital Twin and DCT analytics lake for the ChallengeON hackathon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb==1.5.6",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
# PDF dossiers built by `twin report solution` and `twin report database`; the slide deck by `twin report deck`.
report = ["reportlab>=4.0", "python-pptx>=1.0", "pyyaml>=6"]
dev = ["pytest>=8.0"]

[project.scripts]
twin = "tourism_twin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["static/*"]
tourism_twin = ["domain/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

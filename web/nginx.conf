server {
    listen 80;
    root /usr/share/nginx/html;

    # Mirrors vercel.json: versioned bundle files are immutable, the
    # manifest refreshes quickly, and every non-asset path serves the SPA.
    location /data/manifest.json {
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;
    }

    location /data/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
